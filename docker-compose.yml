services:
  database:
    image: postgres:15-alpine
    container_name: mrking_db_container
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-mrking_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mrking_password}
      POSTGRES_DB: ${DB_NAME:-mrking_db}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: mrking_redis_container
    restart: always
    ports:
      - '6379:6379'

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: mrking_api
    restart: always
    ports:
      - "4000:4000"
    depends_on:
      - database
      - redis
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-mrking_user}:${DB_PASSWORD:-mrking_password}@database:5432/${DB_NAME:-mrking_db}?schema=public

  pos:
    build:
      context: .
      dockerfile: Dockerfile.pos
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    container_name: mrking_pos
    restart: always
    depends_on:
      - api

  kds:
    build:
      context: .
      dockerfile: Dockerfile.kds
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    container_name: mrking_kds
    restart: always
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    container_name: mrking_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - pos
      - kds
      - api

volumes:
  postgres_data:
