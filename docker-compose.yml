version: '3.8'

services:
  database:
    image: postgres:15-alpine
    container_name: mrking_db_container
    restart: always
    environment:
      POSTGRES_USER: mrking_user
      POSTGRES_PASSWORD: mrking_password
      POSTGRES_DB: mrking_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: mrking_redis_container
    restart: always
    ports:
      - '6379:6379'

volumes:
  postgres_data:
