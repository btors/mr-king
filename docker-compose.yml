services:
  database:
    image: postgres:15-alpine
    container_name: mrking_db_container
    restart: always
    environment:
      POSTGRES_USER: mrking_user
      POSTGRES_PASSWORD: mrking_password
      POSTGRES_DB: mrking_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: mrking_redis_container
    restart: always
    ports:
      - '6379:6379'

  api:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run start:dev
    ports:
      - "4000:4000"
    depends_on:
      - database
      - redis
    env_file:
      - .env

  pos:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev --workspace=pos
    ports:
      - "3000:3000"
    depends_on:
      - api
    env_file:
      - .env

  kds:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev --workspace=kds
    ports:
      - "3001:3001"
    depends_on:
      - api
    env_file:
      - .env

volumes:
  postgres_data:
